name: Test

on:
  pull_request:
    branches:
      - main
      - v1
      - v2
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        version: [ 22, 24, 26 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: junit report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: './test-e2e/report/report.xml'
          fail_on_failure: true
