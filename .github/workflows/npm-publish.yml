name: Publish Package

on:
  release:
    types: [published]

# npm trusted publishing: the package is published with a short-lived OIDC token
# (no npm token secret); provenance is attached automatically
permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      # trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: npm publish --access public
